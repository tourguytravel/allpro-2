<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eligibility Check | ALLPRO</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--n:#0b2a4d;--n2:#071d36;--g:#f2b31e;--b:#2c6faa;--m:#6d7b8d;--l:#e3e9f1;--bg:#f6f8fb;--green:#24885f;--red:#b94b4b}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:#10243d}a{text-decoration:none;color:inherit}button,input,select,textarea{font:inherit}.c{max-width:1180px;margin:auto;padding:0 22px}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--l)}.nav{height:72px;display:flex;align-items:center;justify-content:space-between;gap:16px}.logo img{display:block;width:205px;max-height:54px;object-fit:contain}.dn{display:flex;gap:18px;align-items:center;font-size:14px;font-weight:700}.ma{display:none;gap:7px}.btn{display:inline-flex;align-items:center;justify-content:center;padding:11px 16px;border-radius:10px;font-weight:800;border:0;cursor:pointer}.navy{background:var(--n);color:#fff}.gold{background:linear-gradient(135deg,#ff3b6b 0%,#d62976 42%,#8a3ffc 100%);color:#fff}.light{background:#edf3f8;color:var(--n)}.danger{background:#fff0f0;color:var(--red)}
.pagehero{background:var(--n);color:#fff;padding:52px 0}.pagehero h1{font-size:42px;margin:0 0 10px}.pagehero p{margin:0;color:#dce6f0;font-size:17px}
.filters{background:#fff;border:1px solid var(--l);border-radius:14px;padding:15px;display:grid;grid-template-columns:1.6fr 1fr 1fr auto;gap:10px;margin-top:-28px;position:relative;z-index:4;box-shadow:0 12px 30px rgba(11,42,77,.08)}.filters input,.filters select,.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #d7e0e9;border-radius:9px;background:#fff}
.sec{padding:42px 0 64px}.toolbar{display:flex;justify-content:space-between;align-items:end;gap:18px;margin-bottom:20px}.toolbar h2{margin:0;color:var(--n);font-size:29px}.count{color:var(--m);font-size:14px}
.jobs{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.job{background:#fff;border:1px solid var(--l);border-radius:15px;padding:21px;display:flex;flex-direction:column;min-height:245px}.job h3{font-size:21px;margin:0 0 6px;color:var(--n)}.host{font-weight:800;margin-bottom:9px}.meta{color:var(--m);font-size:14px;line-height:1.6}.pay{font-weight:900;color:var(--green);font-size:22px;margin:14px 0 5px}.pill{display:inline-block;width:max-content;padding:5px 9px;border-radius:999px;background:#eef3f8;color:var(--n);font-size:11px;font-weight:800;margin-top:8px}.job-actions{margin-top:auto;padding-top:16px;display:flex;gap:9px}.empty{background:#fff;border:1px solid var(--l);border-radius:14px;padding:30px;text-align:center;color:var(--m)}
.detail-grid{display:grid;grid-template-columns:1.6fr .8fr;gap:20px}.panel{background:#fff;border:1px solid var(--l);border-radius:15px;padding:24px}.panel h2{color:var(--n);margin:0 0 12px}.detail-title{font-size:38px;color:var(--n);margin:0 0 8px}.detail-host{font-size:20px;font-weight:800}.detail-meta{margin:13px 0;color:var(--m);line-height:1.7}.applybox{position:sticky;top:92px}.applybox .pay{font-size:28px}.applybox .btn{width:100%;margin-top:11px}.desc{line-height:1.7;color:#405267}
.auth{max-width:540px;margin:38px auto;background:#fff;border:1px solid var(--l);border-radius:15px;padding:24px}.tabs{display:flex;gap:8px;margin-bottom:18px}.tabs .btn{flex:1}.field{margin-bottom:13px}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:5px}.msg{padding:10px 12px;border-radius:8px;background:#fff5dc;color:#725400;margin-bottom:12px;font-size:13px}.msg.ok{background:#e9f7ef;color:#1f6c49}.msg.err{background:#fff0f0;color:#944545}
.profile-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}.section-title{margin:0 0 16px;color:var(--n)}.appcard{border:1px solid var(--l);border-radius:12px;padding:14px;margin-bottom:10px;background:#fff}.status{display:inline-block;margin-top:8px;padding:6px 9px;border-radius:999px;background:#eef3f8;font-size:11px;font-weight:900;color:var(--n)}
footer{background:var(--n2);color:#cad6e3;padding:26px 0;font-size:13px}.fi{display:flex;justify-content:space-between}
.hidden{display:none!important}
@media(max-width:820px){.dn{display:none}.ma{display:flex}.jobs,.detail-grid,.profile-grid{grid-template-columns:1fr}.filters{grid-template-columns:1fr 1fr}.applybox{position:static}}
@media(max-width:620px){.c{padding:0 15px}.nav{height:66px}.logo img{width:150px;max-height:42px}.ma .btn{padding:8px 10px;font-size:12px}.pagehero{padding:38px 0 50px}.pagehero h1{font-size:33px}.filters{grid-template-columns:1fr;margin-top:-22px}.sec{padding-top:28px}.jobs{grid-template-columns:1fr}.job{min-height:0}.toolbar{display:block}.toolbar .count{margin-top:5px}.detail-title{font-size:30px}.fi{display:block}.fi div+div{margin-top:8px}}

.bottomnav{display:none}
.kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.kpi{background:#f7f9fc;border:1px solid var(--l);border-radius:12px;padding:13px}
.kpi b{display:block;color:var(--n);font-size:20px}.kpi span{font-size:12px;color:var(--m)}
.notice{padding:12px;border-radius:10px;background:#fff7dd;border:1px solid #f1df9d;color:#6c5717;font-size:13px}
.msgcard{border:1px solid var(--l);border-radius:10px;padding:12px;margin-bottom:9px;background:#fff}
.msgcard.unread{border-left:4px solid var(--g)}
.jobfacts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:16px 0}
.fact{border:1px solid var(--l);border-radius:10px;padding:12px;background:#fff}
.fact b{display:block;color:var(--n);font-size:13px;margin-bottom:3px}
.fact span{font-size:13px;color:var(--m)}
.inline-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
@media(max-width:620px){
.bottomnav{display:grid;grid-template-columns:repeat(3,1fr);position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--l);z-index:30;padding:7px 6px calc(7px + env(safe-area-inset-bottom))}
.bottomnav a{text-align:center;font-size:11px;font-weight:800;color:var(--n);padding:5px}
body{padding-bottom:72px}.kpi-grid,.jobfacts{grid-template-columns:1fr}.inline-actions .btn{width:100%}
}

.eligibility-progress{margin:14px 0 18px}
.eligibility-progress .eligibility-label{font-size:16px;font-weight:800;color:var(--m);margin-bottom:8px}
.eligibility-progress .eligibility-label strong{font-weight:900;color:var(--m)}
.eligibility-track{width:100%;height:11px;background:#e9eef4;border-radius:999px;overflow:hidden}
.eligibility-fill{height:100%;width:0%;background:var(--n);border-radius:999px;transition:width .25s ease}

</style></head><body>
<header><div class="c nav">
<a class="logo" href="/"><img src="/allpro-logo.png" alt="ALLPRO International Careers"></a>
<nav class="dn"><a href="/">Home</a><a href="/programs.html">Programs</a><a href="/onboarding.html">Get Started</a><a href="/jobs.html">Find Jobs</a><a href="/candidate.html">Candidate Account</a></nav>
<div class="ma"><a class="btn navy" href="/jobs.html">Jobs</a><a class="btn gold" href="/candidate.html">Account</a></div>
</div></header>



<section class="pagehero"><div class="c"><h1>J-1 Eligibility Check</h1><p>Complete a quick screening before applying to U.S. opportunities.</p></div></section>
<section class="sec"><div class="c"><div class="auth" style="margin-top:0"><div id="msg"></div><form id="form">
<div class="field"><label>Program Interest</label><select id="program"><option value="">Not sure</option><option>Intern</option><option>Trainee</option></select></div>
<div class="field"><label>Education Status</label><select id="education" required><option value="">Select</option><option value="enrolled">Currently enrolled outside the U.S.</option><option value="recent_graduate">Graduated within the last 12 months</option><option value="professional">Working professional</option></select></div>
<div class="field"><label>Graduation Date</label><input id="grad" type="date"></div>
<div class="field"><label>Hospitality Experience (years)</label><input id="exp" type="number" min="0" step="0.5" value="0"></div>
<div class="field"><label>English Level</label><select id="english"><option>Intermediate</option><option>Upper Intermediate</option><option>Advanced</option><option>Fluent</option></select></div>
<div class="field"><label>Available Start Date</label><input id="start" type="date"></div>
<div class="field"><label><input id="passport" type="checkbox"> I have a valid passport or can obtain one.</label></div>
<div class="field"><label><input id="relocate" type="checkbox"> I am willing to relocate to the U.S. for the program.</label></div>
<button class="btn gold" style="width:100%">Save & Check Eligibility</button></form></div></div></section>
<footer><div class="c fi"><div><b>ALLPRO International Careers</b></div><div><a href="/about-social.html">About</a> · <a href="/contact.html">Contact</a> · <a href="/privacy.html">Privacy</a> · <a href="/terms.html">Terms</a></div></div></footer>



<div class="bottomnav"><a href="/jobs.html">Jobs</a><a href="/profile.html">Applications</a><a href="/profile.html">Profile</a></div>
<script>
const sb=supabase.createClient('https://bwygbxsqptrlpexebtgc.supabase.co','sb_publishable_eEcYYRqJO6JD816WvS3tkQ_equAd452');
async function user(){const {data:{user}}=await sb.auth.getUser();if(!user){localStorage.setItem('returnAfterLogin','/eligibility.html');location.href='/candidate.html';throw 0}return user;}
function recommend(){if(education.value==='enrolled'||education.value==='recent_graduate')return 'Intern';if(education.value==='professional'&&Number(exp.value)>=1)return 'Trainee';return 'Needs ALLPRO Review';}
form.onsubmit=async e=>{e.preventDefault();const u=await user();const rec=recommend();const note=(!passport.checked||!relocate.checked)?'Additional review needed before placement.':'Potentially eligible based on the information provided.';const payload={candidate_id:u.id,program_interest:program.value||null,education_status:education.value,graduation_date:grad.value||null,hospitality_experience_years:Number(exp.value||0),english_level:english.value,passport_ready:passport.checked,willing_to_relocate:relocate.checked,available_start_date:start.value||null,recommended_program:rec,eligibility_note:note,updated_at:new Date().toISOString()};const {error}=await sb.from('candidate_eligibility').upsert(payload);msg.innerHTML='<div class="msg '+(error?'err':'ok')+'">'+(error?error.message:`Recommended pathway: <b>${rec}</b><br>${note}`)+'</div>';if(!error)setTimeout(()=>location.href='/profile.html',1400);}
(async()=>{try{const u=await user();const {data}=await sb.from('candidate_eligibility').select('*').eq('candidate_id',u.id).maybeSingle();if(data){program.value=data.program_interest||'';education.value=data.education_status||'';grad.value=data.graduation_date||'';exp.value=data.hospitality_experience_years||0;english.value=data.english_level||'Intermediate';start.value=data.available_start_date||'';passport.checked=!!data.passport_ready;relocate.checked=!!data.willing_to_relocate;}}catch(e){}})();
</script></body></html>
