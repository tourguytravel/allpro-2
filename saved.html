<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Saved Jobs | ALLPRO</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--n:#0b2a4d;--n2:#071d36;--g:#f2b31e;--b:#2c6faa;--m:#6d7b8d;--l:#e3e9f1;--bg:#f6f8fb;--green:#24885f;--red:#b94b4b}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:#10243d}a{text-decoration:none;color:inherit}button,input,select,textarea{font:inherit}.c{max-width:1180px;margin:auto;padding:0 22px}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--l)}.nav{height:72px;display:flex;align-items:center;justify-content:space-between;gap:16px}.logo img{display:block;width:205px;max-height:54px;object-fit:contain}.dn{display:flex;gap:18px;align-items:center;font-size:14px;font-weight:700}.ma{display:none;gap:7px}.btn{display:inline-flex;align-items:center;justify-content:center;padding:11px 16px;border-radius:10px;font-weight:800;border:0;cursor:pointer}.navy{background:var(--n);color:#fff}.gold{background:var(--g);color:#fff}.light{background:#edf3f8;color:var(--n)}.danger{background:#fff0f0;color:var(--red)}
.pagehero{background:var(--n);color:#fff;padding:52px 0}.pagehero h1{font-size:42px;margin:0 0 10px}.pagehero p{margin:0;color:#dce6f0;font-size:17px}
.filters{background:#fff;border:1px solid var(--l);border-radius:14px;padding:15px;display:grid;grid-template-columns:1.6fr 1fr 1fr auto;gap:10px;margin-top:-28px;position:relative;z-index:4;box-shadow:0 12px 30px rgba(11,42,77,.08)}.filters input,.filters select,.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #d7e0e9;border-radius:9px;background:#fff}
.sec{padding:42px 0 64px}.toolbar{display:flex;justify-content:space-between;align-items:end;gap:18px;margin-bottom:20px}.toolbar h2{margin:0;color:var(--n);font-size:29px}.count{color:var(--m);font-size:14px}
.jobs{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.job{background:#fff;border:1px solid var(--l);border-radius:15px;padding:21px;display:flex;flex-direction:column;min-height:245px}.job h3{font-size:21px;margin:0 0 6px;color:var(--n)}.host{font-weight:800;margin-bottom:9px}.meta{color:var(--m);font-size:14px;line-height:1.6}.pay{font-weight:900;color:var(--green);font-size:22px;margin:14px 0 5px}.pill{display:inline-block;width:max-content;padding:5px 9px;border-radius:999px;background:#eef3f8;color:var(--n);font-size:11px;font-weight:800;margin-top:8px}.job-actions{margin-top:auto;padding-top:16px;display:flex;gap:9px}.empty{background:#fff;border:1px solid var(--l);border-radius:14px;padding:30px;text-align:center;color:var(--m)}
.detail-grid{display:grid;grid-template-columns:1.6fr .8fr;gap:20px}.panel{background:#fff;border:1px solid var(--l);border-radius:15px;padding:24px}.panel h2{color:var(--n);margin:0 0 12px}.detail-title{font-size:38px;color:var(--n);margin:0 0 8px}.detail-host{font-size:20px;font-weight:800}.detail-meta{margin:13px 0;color:var(--m);line-height:1.7}.applybox{position:sticky;top:92px}.applybox .pay{font-size:28px}.applybox .btn{width:100%;margin-top:11px}.desc{line-height:1.7;color:#405267}
.auth{max-width:540px;margin:38px auto;background:#fff;border:1px solid var(--l);border-radius:15px;padding:24px}.tabs{display:flex;gap:8px;margin-bottom:18px}.tabs .btn{flex:1}.field{margin-bottom:13px}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:5px}.msg{padding:10px 12px;border-radius:8px;background:#fff5dc;color:#725400;margin-bottom:12px;font-size:13px}.msg.ok{background:#e9f7ef;color:#1f6c49}.msg.err{background:#fff0f0;color:#944545}
.profile-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}.section-title{margin:0 0 16px;color:var(--n)}.appcard{border:1px solid var(--l);border-radius:12px;padding:14px;margin-bottom:10px;background:#fff}.status{display:inline-block;margin-top:8px;padding:6px 9px;border-radius:999px;background:#eef3f8;font-size:11px;font-weight:900;color:var(--n)}
footer{background:var(--n2);color:#cad6e3;padding:26px 0;font-size:13px}.fi{display:flex;justify-content:space-between}
.hidden{display:none!important}
@media(max-width:820px){.dn{display:none}.ma{display:flex}.jobs,.detail-grid,.profile-grid{grid-template-columns:1fr}.filters{grid-template-columns:1fr 1fr}.applybox{position:static}}
@media(max-width:620px){.c{padding:0 15px}.nav{height:66px}.logo img{width:150px;max-height:42px}.ma .btn{padding:8px 10px;font-size:12px}.pagehero{padding:38px 0 50px}.pagehero h1{font-size:33px}.filters{grid-template-columns:1fr;margin-top:-22px}.sec{padding-top:28px}.jobs{grid-template-columns:1fr}.job{min-height:0}.toolbar{display:block}.toolbar .count{margin-top:5px}.detail-title{font-size:30px}.fi{display:block}.fi div+div{margin-top:8px}}

.badge-live{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:999px;background:#e8f7ef;color:#1c6f4c;font-size:11px;font-weight:900}
.badge-live:before{content:"";width:7px;height:7px;border-radius:50%;background:#2aa66f;display:inline-block}
.savebtn{background:#fff;border:1px solid var(--l);color:var(--n)}
.alertbar{background:#fff9e7;border:1px solid #f1dfa4;border-radius:12px;padding:12px 14px;margin-bottom:14px;color:#6c5716}
.notice-list{display:grid;gap:9px}
.notice-item{border:1px solid var(--l);background:#fff;border-radius:11px;padding:12px}
.notice-item.unread{border-left:4px solid var(--g)}
.notice-item h4{margin:0 0 4px;color:var(--n)}
.notice-item p{margin:0;color:var(--m);font-size:13px;line-height:1.5}
.scheduler{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.scheduler .field{margin:0}
.quick-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.quick{border:1px solid var(--l);border-radius:12px;padding:14px;background:#fff}
.quick b{display:block;color:var(--n);margin-bottom:4px}
@media(max-width:620px){.scheduler,.quick-grid{grid-template-columns:1fr}}
</style></head><body>
<header><div class="c nav">
<a class="logo" href="/"><img src="/allpro-logo.png" alt="ALLPRO International Careers"></a>
<nav class="dn"><a href="/">Home</a><a href="/programs.html">Programs</a><a href="/jobs.html">Find Jobs</a><a href="/candidate.html">Candidate Account</a></nav>
<div class="ma"><a class="btn navy" href="/jobs.html">Jobs</a><a class="btn gold" href="/candidate.html">Account</a></div>
</div></header>



<section class="pagehero"><div class="c"><h1>Saved Jobs</h1><p>Keep your favorite ALLPRO opportunities in one place.</p></div></section>
<section class="sec"><div class="c"><div id="saved" class="jobs"></div></div></section>
<div class="auth"><div class="tabs"><button id="signupTab" class="btn navy" onclick="showTab('signup')">Create Account</button><button id="signinTab" class="btn light" onclick="showTab('signin')">Sign In</button></div><div id="msg"></div>

<form id="signin" class="hidden"><div class="field"><label>Email</label><input id="iem" type="email" required></div><div class="field"><label>Password</label><input id="ipw" type="password" required></div><button class="btn navy" style="width:100%">Sign In</button><button type="button" class="btn light" style="width:100%;margin-top:8px" onclick="forgot()">Forgot Password?</button></form></div>
<div class="auth"><div class="tabs"><button id="signupTab" class="btn navy" onclick="showTab('signup')">Create Account</button><button id="signinTab" class="btn light" onclick="showTab('signin')">Sign In</button></div><div id="msg"></div>
<form id="signup"><div class="field"><label>First Name</label><input id="fn" required></div><div class="field"><label>Last Name</label><input id="ln" required></div><div class="field"><label>Email</label><input id="em" type="email" required></div><div class="field"><label>Password</label><input id="pw" type="password" minlength="8" required></div><button class="btn gold" style="width:100%">Create Account</button></form>
<form id="signin" class="hidden"><div class="field"><label>Email</label><input id="iem" type="email" required></div><div class="field"><label>Password</label><input id="ipw" type="password" required></div><button class="btn navy" style="width:100%">Sign In</button></form></div>
<footer><div class="c fi"><div><b>ALLPRO International Careers</b></div><div>U.S. Hospitality Career Programs</div></div></footer>

<script>
const sb=supabase.createClient('https://bwygbxsqptrlpexebtgc.supabase.co','sb_publishable_eEcYYRqJO6JD816WvS3tkQ_equAd452');
async function init(){const {data:{user}}=await sb.auth.getUser();if(!user)return location.href='/candidate.html';const {data,error}=await sb.from('saved_jobs').select('id,job_id,jobs(*)').eq('candidate_id',user.id).order('created_at',{ascending:false});if(error){saved.innerHTML='<div class="empty">'+error.message+'</div>';return}saved.innerHTML=data&&data.length?data.map(x=>{const j=x.jobs;return `<article class="job"><div><span class="badge-live">${j?.last_synced_at?'Recently synced':'Open'}</span></div><h3 style="margin-top:10px">${j?.title||'Position'}</h3><div class="host">${j?.host_name||''}</div><div class="meta">📍 ${j?.city||''}, ${j?.state||''}<br>${j?.program_type||''}</div><div class="pay">$${Number(j?.hourly_wage||0).toFixed(2)} / hour</div><div class="job-actions"><a class="btn navy" href="/job.html?id=${j?.id}">View Job</a><button class="btn light" onclick="removeSaved('${x.id}')">Remove</button></div></article>`}).join(''):'<div class="empty">You haven’t saved any jobs yet.</div>';}
async function removeSaved(id){await sb.from('saved_jobs').delete().eq('id',id);init();}
init();
</script></body></html>
